services:
  thermoscan-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thermoscan_cad_app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./api/historico_exames.db:/app/api/historico_exames.db
