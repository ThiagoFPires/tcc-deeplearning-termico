services:
  thermoscan-app:
    build:
      context: ./classificador-termico
      dockerfile: Dockerfile
    container_name: thermoscan_cad_app
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./classificador-termico/interface:/app/interface
      - ./classificador-termico/api:/app/api
      - ./classificador-termico/treinamento:/app/treinamento
